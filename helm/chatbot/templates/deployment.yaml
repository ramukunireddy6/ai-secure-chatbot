apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-api
  labels:
    app: chatbot-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: chatbot-api
  template:
    metadata:
      labels:
        app: chatbot-api
    spec:
      containers:
        - name: chatbot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
            - containerPort: {{ .Values.metrics.port }}
          env:
            - name: OIDC_ISSUER
              value: "{{ .Values.env.OIDC_ISSUER }}"
            - name: OIDC_AUDIENCE
              value: "{{ .Values.env.OIDC_AUDIENCE }}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"