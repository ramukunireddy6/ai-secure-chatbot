apiVersion: v1
kind: Service
metadata:
  name: chatbot-api
  labels:
    app: chatbot-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: chatbot-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.port }}
