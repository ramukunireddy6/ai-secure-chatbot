replicaCount: 2

image:
  repository: chatbot-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

metrics:
  enabled: true
  port: 8001

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"

env:
  OIDC_ISSUER: "https://issuer.example.com"
  OIDC_AUDIENCE: "chatbot"
